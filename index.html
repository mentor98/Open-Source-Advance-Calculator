<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scientific Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="calculator" aria-label="Scientific calculator">
        <input
            type="text"
            class="display"
            id="display"
            aria-label="Calculator display"
            readonly
        >

        <div class="buttons" aria-label="Calculator keys">
            <button type="button" class="clear-button" data-action="clear">AC</button>
            <button type="button" class="delete-button" data-action="delete">DEL</button>
            <button type="button" class="open-parenthesis-button" data-value="(">(</button>
            <button type="button" class="close-parenthesis-button" data-value=")">)</button>
            <button type="button" class="sin-button" data-action="sin">sin</button>
            <button type="button" class="cos-button" data-action="cos">cos</button>
            <button type="button" class="tan-button" data-action="tan">tan</button>
            <button type="button" class="divide-button" data-value="/">÷</button>
            <button type="button" class="square-button" data-action="square">x²</button>
            <button type="button" class="power-button" data-value="^">xʸ</button>
            <button type="button" class="pi-button" data-value="pi">π</button>
            <button type="button" class="multiply-button" data-value="*">×</button>
            <button type="button" data-value="7">7</button>
            <button type="button" data-value="8">8</button>
            <button type="button" data-value="9">9</button>
            <button type="button" class="subtract-button" data-value="-">−</button>
            <button type="button" data-value="4">4</button>
            <button type="button" data-value="5">5</button>
            <button type="button" data-value="6">6</button>
            <button type="button" class="add-button" data-value="+">+</button>
            <button type="button" data-value="1">1</button>
            <button type="button" data-value="2">2</button>
            <button type="button" data-value="3">3</button>
            <button type="button" class="equals-button" data-action="calculate">=</button>
            <button type="button" class="zero-button" data-value="0">0</button>
            <button type="button" data-value=".">.</button>
        </div>
    </main>
    <script src="script.js" defer></script>
</body>
</html>
